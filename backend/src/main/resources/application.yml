server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: medisync-live
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/medisync_live?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:medisync}
    password: ${DB_PASSWORD:medisync}
    hikari:
      maximum-pool-size: 10
      # READ COMMITTED avoids InnoDB gap locks; all writers lock inventory rows explicitly.
      transaction-isolation: TRANSACTION_READ_COMMITTED
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # schema is owned by Flyway migrations
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    deserialization:
      # Reject 2.5 for integer fields instead of silently truncating it to 2.
      accept-float-as-int: false
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

medisync:
  jwt:
    # Override with JWT_SECRET (>= 32 bytes) outside local development.
    secret: ${JWT_SECRET:medisync-live-dev-only-secret-change-me-in-production-0123456789}
    ttl: ${JWT_TTL:PT8H}
  seed-demo-users: ${SEED_DEMO_USERS:true}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  activity:
    default-limit: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5level [%15.15thread] %-40.40logger{39} : %msg%n"
  level:
    com.medisync.live: INFO
